# AWS 主要サービス一覧（SAA-C03 対策）のデータ
#
# ■ サービスを追加するには
#   1. 下の services: に 1 件追記する（どこに書いても、表示はカテゴリ順・この並び順になる）
#   2. `uv run --with pyyaml python build.py` を実行する → index.html が作り直される
#
# ■ 項目
#   id        : 英小文字とハイフンの識別子（重複不可）
#   name      : 正式名称（例 "Amazon EC2"）
#   short     : 略称・通称（任意）
#   category  : 下の categories: のキー
#   icon      : diagrams ライブラリ同梱の AWS アイコン "<分類>/<ファイル名>"（拡張子なし）
#               一覧は `uv run --with diagrams python build.py --list-icons`
#               icons/ に同名の PNG を置けば、そちらが優先される（自前のアイコンも使える）
#   summary   : 基本機能（1〜2 文）
#   use_when  : どういうときに使うか（1 文。「〜とき」で終える）。カードと比較表に出る
#   attrs     : 比較表の列の値。列名はそのカテゴリの columns と同じにする
#               例 attrs: {"種類": "ブロック", "主な使い方": "1 台の EC2 にアタッチ"}
#   keywords  : 試験で「この語が出たらこのサービス」となるキーワード（任意）
#   compare   : 紛らわしいサービスとの違い（任意）
#   tags      : 自由なタグ（任意。例 [頻出, 要復習]）。検索の対象になる
#
# ■ カテゴリ（categories:）
#   label   : 表示名
#   columns : 比較表の列（サービス名と「どういうときに使うか」の列は自動で付く）
#   points  : 使い分けのポイント（任意。試験での判断ルールを 1 行ずつ）
#   カテゴリに属するサービスは、すべて自動で比較表の行になる
#   usecases: ユースケース（任意）。サービスの組み合わせを流れ図で見せる
#     - title: 見出し
#       need : 要件（試験の問題文のような「〜したい」）
#       flow : 左から順に並ぶ段。各段は 1 つのノードか、同時に動くノードのリスト [..., ...]
#              ノードは {svc: サービスの id, note: その段での役割}
#              AWS 以外は {label: 利用者, icon: general/users, note: ...}
#       why  : この組み合わせにする理由・試験での注意点（1 行ずつ）

categories:
  compute:
    label: コンピューティング
    columns: ["自分で管理する範囲", "課金"]
    points:
      - "サーバー管理を減らしたいほど EC2 → Elastic Beanstalk → Lambda の順に選ぶ。"
      - "「15 分を超える処理」なら Lambda は不可。EC2・Batch・コンテナを検討する。"
      - "「オンプレミスで AWS と同じサービスを」なら Outposts。"
  container:
    label: コンテナ
    columns: ["役割", "サーバー（ホスト）の管理"]
    points:
      - "オーケストレーション（ECS / EKS）と実行環境（EC2 / Fargate）は組み合わせで選ぶ。"
      - "「Kubernetes」と出たら EKS、「サーバー管理なし」と出たら Fargate。"
  storage:
    label: ストレージ
    columns: ["種類", "主な使い方"]
    points:
      - "1 台の EC2 のディスク → EBS、複数の Linux で共有 → EFS、Windows で共有 → FSx for Windows File Server。"
      - "大量のファイルを安く丈夫に → S3、めったに読まない長期保存 → S3 Glacier。"
      - "オンプレミスから AWS のストレージを使う → Storage Gateway。"
  database:
    label: データベース
    columns: ["データモデル", "得意なこと"]
    points:
      - "SQL・トランザクションが必要 → RDS / Aurora、大規模で単純なキー検索 → DynamoDB。"
      - "読み取りを速くしたい → ElastiCache（DynamoDB なら DAX）やリードレプリカ。"
      - "分析・集計 → Redshift（S3 のデータをその場で検索するだけなら Athena）。"
  network:
    label: ネットワーク・コンテンツ配信
    columns: ["役割", "つなぐもの・対象"]
    points:
      - "プライベートサブネットから外へ → NAT ゲートウェイ、AWS サービスへ内部で → VPC エンドポイント。"
      - "オンプレミスとの接続：すぐ・安く → Site-to-Site VPN、安定した帯域 → Direct Connect。"
      - "コンテンツをキャッシュして配信 → CloudFront、キャッシュせず経路を速く・固定 IP → Global Accelerator。"
      - "VPC がたくさん → Transit Gateway（少数なら VPC ピアリング）。"
  security:
    label: セキュリティ・ID・コンプライアンス
    columns: ["種類", "対象"]
    points:
      - "AWS を操作する人の権限 → IAM、アプリの利用者の認証 → Cognito。"
      - "検出系の区別：脅威 → GuardDuty、脆弱性 → Inspector、S3 の個人情報 → Macie。"
      - "Web 攻撃（SQL インジェクションなど）→ WAF、DDoS → Shield。"
      - "鍵の管理 → KMS（専有ハードウェアが必須なら CloudHSM）、パスワードの自動ローテーション → Secrets Manager。"
  integration:
    label: アプリケーション統合
    columns: ["配信のしかた", "特徴"]
    points:
      - "「疎結合」「非同期」「バッファ」→ SQS、「複数の宛先へ同時に」→ SNS（SNS + SQS でファンアウト）。"
      - "処理の順番や分岐を管理 → Step Functions、イベントやスケジュールで起動 → EventBridge。"
      - "既存の ActiveMQ / RabbitMQ をそのまま移す → Amazon MQ。"
    usecases:
      - title: 注文の受付と処理を切り離す（疎結合）
        need: セールで注文が急増しても取りこぼさず、処理側が止まっても受付は続けたい
        flow:
          - {label: 利用者, icon: general/users}
          - {svc: elb, note: 通信を振り分ける}
          - {svc: ec2-auto-scaling, note: Web 層（注文を受け付ける）}
          - {svc: sqs, note: 注文をためておく}
          - {svc: ec2-auto-scaling, note: 処理層（キューの長さで台数を増減）}
        why:
          - Web 層は SQS に入れた時点で応答できるので、処理が遅れても受付は止まらない
          - 処理層は、キューにたまったメッセージ数を指標にして Auto Scaling する
          - 何度処理しても失敗するメッセージは、デッドレターキューに退避して原因を調べる
      - title: 1 つのイベントを複数の処理へ配る（ファンアウト）
        need: 注文が確定したら、在庫の引き当て・配送の手配・確認メールを同時に、互いに影響せず実行したい
        flow:
          - {label: 注文アプリ, icon: general/traditional-server}
          - {svc: sns, note: 「注文確定」を発行}
          - [{svc: sqs, note: 在庫処理用のキュー}, {svc: sqs, note: 配送処理用のキュー}, {svc: lambda, note: 確認メールを送る}]
        why:
          - SNS は届けるだけなので、間に SQS を入れると受信側が止まっていてもメッセージが消えない
          - 処理を増やすときは SNS に購読者を足すだけで、送信側のアプリは変えなくてよい
          - 「SNS + SQS でファンアウト」は試験で頻出の組み合わせ
      - title: ファイルが届いたら自動で処理する（イベント駆動）
        need: S3 に画像がアップロードされたら、サーバーを管理せずにサムネイルを作りたい
        flow:
          - {label: 利用者, icon: general/users}
          - {svc: s3, note: 画像をアップロード}
          - {svc: eventbridge, note: 「オブジェクト作成」を検知}
          - {svc: lambda, note: サムネイルを作る}
          - {svc: s3, note: 別のバケットに保存}
        why:
          - S3 のイベント通知から Lambda を直接呼んでもよい。EventBridge を挟むと、条件での絞り込みや複数の宛先への振り分けがしやすい
          - 同じバケットの同じ場所に書き戻すと、またイベントが起きて処理が繰り返されるので、保存先は分ける
          - 処理が重い・15 分を超えるなら、Lambda の代わりに ECS（Fargate）や AWS Batch を使う
      - title: 毎晩のデータ処理を順番に実行し、失敗を知らせる
        need: 毎晩 1 時に「抽出 → 変換」を順番に実行し、失敗したら担当者にメールで知らせたい
        flow:
          - {svc: eventbridge, note: 毎日 1 時に起動（スケジュール）}
          - {svc: step-functions, note: 順番・リトライ・失敗時の分岐を管理}
          - {svc: lambda, note: データを抽出}
          - {svc: glue, note: データを変換}
          - {svc: sns, note: 失敗したらメール}
        why:
          - cron 用のサーバーを置かずに、EventBridge のスケジュールで起動できる
          - 処理同士をつなぐコード（リトライや分岐）を自分で書かず、Step Functions に任せる
          - 失敗時は Step Functions の中でエラーを捕まえて、SNS で通知する
      - title: 既存のメッセージ基盤をそのまま移す
        need: オンプレミスで ActiveMQ を使っているアプリを、コードをほとんど変えずに AWS へ移したい
        flow:
          - {label: オンプレミスのアプリ, icon: general/traditional-server}
          - {svc: mq, note: ActiveMQ 互換のブローカー}
          - {svc: ec2, note: AWS へ移したアプリ}
        why:
          - JMS・AMQP・MQTT などのプロトコルがそのまま使えるので、アプリの書き換えが少ない
          - 新しく作るアプリなら、運用が楽でスケールしやすい SQS / SNS を選ぶ
          - 「既存の」「書き換えずに」「業界標準のプロトコル」が Amazon MQ を選ぶ決め手
  management:
    label: マネジメント・ガバナンス
    columns: ["分かること・できること", "試験での問われ方"]
    points:
      - "監視（性能）→ CloudWatch、操作の記録（誰が）→ CloudTrail、設定の記録（どう変わったか）→ Config。"
      - "複数アカウントの統制 → Organizations（SCP）、その環境づくりを自動で → Control Tower。"
    usecases:
      - title: CPU 使用率が上がったら通知し、台数を増やす
        need: Web サーバーの CPU 使用率が 70% を超えたら、担当者に知らせて自動でサーバーを増やしたい
        flow:
          - {svc: ec2, note: メトリクスを送る}
          - {svc: cloudwatch, note: アラームが 70% 超えを検知}
          - [{svc: sns, note: 担当者にメール}, {svc: ec2-auto-scaling, note: 台数を増やす}]
        why:
          - CloudWatch アラームのアクションに、SNS の通知と Auto Scaling のポリシーを両方設定できる
          - メモリやディスクの使用率は標準では取れない。CloudWatch エージェントを入れてカスタムメトリクスとして送る
          - 台数の調整だけなら、ターゲット追跡スケーリング（例：CPU 50% を保つ）が一番手間が少ない
      - title: 操作の記録を残し、重要な操作をすぐ知らせる
        need: 誰がいつ何をしたかを長期間残し、ルートユーザーのログインなどの重要な操作はすぐに知りたい
        flow:
          - {svc: cloudtrail, note: 全リージョンの API 操作を記録}
          - [{svc: s3, note: ログを長期保存}, {svc: eventbridge, note: 重要な操作を検知}]
          - {svc: sns, note: EventBridge から担当者に通知}
        why:
          - ログを S3 に保存し、ライフサイクルで S3 Glacier に移すと長期保存が安くなる
          - 改ざんを防ぐには、CloudTrail のログファイルの整合性検証や、S3 オブジェクトロックを使う
          - 保存したログを SQL で調べたいときは Athena
      - title: ルール違反の設定を見つけて自動で直す
        need: セキュリティグループで SSH（22 番ポート）が全開放されたら、検出して自動で閉じたい
        flow:
          - {label: 運用者が設定を変更, icon: general/user}
          - {svc: config, note: ルールで違反を検出}
          - [{svc: systems-manager, note: Automation で自動修復}, {svc: sns, note: 違反を通知}]
        why:
          - AWS Config のルールで準拠・非準拠を評価し、修復アクションに Systems Manager Automation を指定できる
          - 設定が「どう変わったか」の履歴は Config、「誰が変えたか」は CloudTrail で見る
          - 複数のアカウントにまとめて適用するなら、Organizations と組み合わせる
      - title: 複数のアカウントをまとめて統制する
        need: 部署ごとにアカウントを分けつつ、ログイン方法・ログ・禁止事項は全社で統一したい
        flow:
          - {svc: control-tower, note: マルチアカウント環境を構築}
          - {svc: organizations, note: OU と SCP で使える範囲を制限}
          - [{svc: iam-identity-center, note: 1 つの ID で各アカウントへ}, {svc: cloudtrail, note: 全アカウントの操作を記録}, {svc: config, note: 全アカウントの設定を評価}]
        why:
          - SCP は「そのアカウントで使える上限」を決めるもので、権限を与えるものではない（許可は IAM で行う）
          - ログはログ保管専用のアカウントの S3 に集めるのが定番
          - これから作るなら Control Tower で一式を自動で用意できる
      - title: サーバーのパッチ適用とログインを安全にする
        need: 数百台の EC2 に毎月パッチを当てたい。SSH のポートは開けず、踏み台サーバーもなくしたい
        flow:
          - {svc: systems-manager, note: Patch Manager・Session Manager}
          - {svc: ec2, note: SSM エージェントで管理される}
          - {svc: cloudwatch, note: 操作ログを保存（CloudWatch Logs）}
        why:
          - Session Manager なら 22 番ポートも踏み台も要らず、操作ログも残せる
          - EC2 には SSM エージェントと、Systems Manager を使うための IAM ロールが必要
          - プライベートサブネットのサーバーは、NAT ゲートウェイか VPC エンドポイント経由で Systems Manager と通信する
      - title: 同じ環境を別のリージョンにも作る
        need: 東京リージョンと同じ構成を、災害対策として大阪リージョンにも手作業なしで用意したい
        flow:
          - {svc: cloudformation, note: テンプレートからスタックを作成}
          - [{svc: vpc, note: 大阪リージョンに同じ構成}, {svc: ec2-auto-scaling, note: 大阪リージョンに同じ構成}, {svc: rds, note: 大阪リージョンに同じ構成}]
        why:
          - テンプレートを使い回せるので、手作業のミスなく同じ環境を何度でも作れる
          - 複数のアカウントやリージョンへ一度に展開するなら StackSets
          - 変更する前に影響を確かめたいときは、変更セットを使う
  analytics:
    label: 分析
    columns: ["処理のタイミング", "主な役割"]
    points:
      - "リアルタイムに自前で処理 → Kinesis Data Streams、保存先へ流すだけ → Data Firehose。"
      - "S3 のデータをその場で SQL → Athena、変換（ETL）→ Glue、大規模処理（Spark）→ EMR。"
  migration:
    label: 移行・転送
    columns: ["移すもの", "方法"]
    points:
      - "回線で何週間もかかる量 → Snow Family、オンラインで転送・同期 → DataSync。"
      - "DB → DMS、サーバー丸ごと → Application Migration Service、SFTP の受け口 → Transfer Family。"
  ml:
    label: 機械学習
    columns: ["入力", "出力"]
    points:
      - "既製の AI サービス（Rekognition・Textract など）で足りるならそれを使い、独自モデルが必要なら SageMaker AI。"
      - "入力と出力で覚える：画像 → Rekognition、書類 → Textract、音声 → Transcribe、文章 → Comprehend。"
  devtools:
    label: 開発者ツール
    columns: ["CI/CD での担当", "対象"]
    points:
      - "流れをつなぐ → CodePipeline、ビルド → CodeBuild、デプロイ → CodeDeploy。"

services:
  # ---------- コンピューティング ----------
  - id: ec2
    name: Amazon EC2
    short: Elastic Compute Cloud
    category: compute
    icon: compute/ec2
    summary: 仮想サーバー（インスタンス）を必要な分だけ起動できる。OS やミドルウェアを自由に選べる。
    use_when: "OS やミドルウェアを自由に選びたい、長時間動かし続けるサーバーが必要なとき"
    attrs: {"自分で管理する範囲": "OS から上すべて", "課金": "起動している時間"}
    keywords: [仮想サーバー, インスタンスタイプ, オンデマンド, リザーブドインスタンス, スポットインスタンス, Savings Plans]
    compare: OS の管理まで自分で行う。サーバー管理をしたくないなら Lambda / Fargate。
    tags: [頻出]
  - id: ec2-auto-scaling
    name: Amazon EC2 Auto Scaling
    category: compute
    icon: compute/ec2-auto-scaling
    summary: 負荷やスケジュールに応じて EC2 インスタンスの台数を自動で増減する。異常なインスタンスの置き換えも行う。
    use_when: "アクセス量の変動に合わせて台数を自動で増減したい、壊れたインスタンスを自動で置き換えたいとき"
    attrs: {"自分で管理する範囲": "EC2 の台数を自動調整", "課金": "無料（起動した EC2 の分だけ）"}
    keywords: [需要に応じて台数を調整, ターゲット追跡, 起動テンプレート, 最小・最大・希望容量]
    tags: [頻出]
  - id: lambda
    name: AWS Lambda
    category: compute
    icon: compute/lambda
    summary: サーバーを用意せずにコードを実行するサーバーレスの実行環境。イベントをきっかけに動き、実行時間分だけ課金される。
    use_when: "イベントをきっかけに 15 分以内の処理を動かし、サーバー管理をしたくないとき"
    attrs: {"自分で管理する範囲": "コードだけ", "課金": "リクエスト数＋実行時間"}
    keywords: [サーバーレス, イベント駆動, 運用オーバーヘッド最小, 最大実行時間 15 分]
    compare: 15 分を超える長時間処理には向かない（ECS/Fargate や Batch を検討）。
    tags: [頻出]
  - id: elastic-beanstalk
    name: AWS Elastic Beanstalk
    category: compute
    icon: compute/elastic-beanstalk
    summary: コードをアップロードするだけで、EC2・ロードバランサー・Auto Scaling などの実行環境を自動で構築・管理する。
    use_when: "インフラの細かい設定をせずに、Web アプリを手早くデプロイしたいとき"
    attrs: {"自分で管理する範囲": "コード（環境は自動構築）", "課金": "無料（作られた EC2 などの分だけ）"}
    keywords: [アプリのデプロイを簡単に, インフラを意識しない, PaaS]
  - id: batch
    name: AWS Batch
    category: compute
    icon: compute/batch
    summary: 大量のバッチ処理ジョブを、必要な計算資源を自動で用意しながら実行する。
    use_when: "大量のバッチジョブや長時間の計算処理を、計算資源の用意を自動化して実行したいとき"
    attrs: {"自分で管理する範囲": "ジョブの定義", "課金": "無料（使った EC2・Fargate の分だけ）"}
    keywords: [バッチジョブ, 長時間の計算処理, ジョブキュー]
  - id: lightsail
    name: Amazon Lightsail
    category: compute
    icon: compute/lightsail
    summary: サーバー・ストレージ・ネットワークをまとめた定額の簡易 VPS。小規模サイト向け。
    use_when: "小規模な Web サイトやブログを、定額で簡単に始めたいとき"
    attrs: {"自分で管理する範囲": "OS から上（簡易）", "課金": "月額定額"}
    keywords: [定額, 簡単に Web サイトを立ち上げ, 小規模]
  - id: outposts
    name: AWS Outposts
    category: compute
    icon: compute/outposts
    summary: AWS のハードウェアを自社データセンターに設置し、オンプレミスで AWS と同じサービスを使えるようにする。
    use_when: "低レイテンシーやデータの所在の要件で、オンプレミスに置いたまま AWS のサービスを使いたいとき"
    attrs: {"自分で管理する範囲": "OS から上＋設置場所", "課金": "構成ごとの契約"}
